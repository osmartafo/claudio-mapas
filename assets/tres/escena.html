<script type="module">
import * as THREE from 'three';
import { OutlineEffect } from './OutlineEffect.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

import { crearPersonaje, tonoTarjetas } from './caricatura.js';

// Escena 3D estilo caricatura: sombreado en bandas, contorno negro, colores planos.
// window.preparar(def, ancho, alto) arma la escena; window.cuadro(u) la dibuja en el instante u (0..1) y devuelve un JPEG.
const R = THREE.MathUtils.degToRad;
let renderer, efecto, escena, camara, def, objetos = {}, base = {}, sprites = [], flechas = [];
let cine = true, compositor = null, bokeh = null, grano = null;

// materiales de cine: cada objeto puede decir de qué está hecho
const MATERIALES = {
  metal: { roughness: 0.28, metalness: 1.0 }, cromo: { roughness: 0.08, metalness: 1.0 },
  plastico: { roughness: 0.42, metalness: 0.0 }, madera: { roughness: 0.75, metalness: 0.0 },
  vidrio: { roughness: 0.02, metalness: 0.0, transparent: true, opacity: 0.35, clearcoat: 1.0 },
  tela: { roughness: 0.95, metalness: 0.0, sheen: 1.0 }, brillo: { roughness: 0.15, metalness: 0.0, clearcoat: 1.0 },
  luz: { roughness: 0.5, metalness: 0.0, emissiveIntensity: 1.1 }, piedra: { roughness: 0.9, metalness: 0.0 },
};
function materialCine(o) {
  const t = MATERIALES[o.material] || (/^#(C|D|E)[0-9A-F]C[0-9A-F]C[0-9A-F]/i.test(o.color || '') ? MATERIALES.metal : MATERIALES.plastico);
  const p = Object.assign({ color: new THREE.Color(o.color || '#dddddd') }, t);
  if (o.material === 'luz') p.emissive = new THREE.Color(o.color || '#FFD9A0');
  if (o.transparente) Object.assign(p, { transparent: true, opacity: 0.45 });
  // con personajes de caricatura el mundo va mate y pintado: nada de brillos que se quemen junto a una lámpara
  if ((def.personajes || 'caricatura') === 'caricatura' && o.material !== 'luz') {
    Object.assign(p, { roughness: Math.max(p.roughness ?? 0.6, 0.72), clearcoat: 0, metalness: Math.min(p.metalness ?? 0, 0.3), sheen: 0 });
  }
  return new THREE.MeshPhysicalMaterial(p);
}

// grano de película, viñeta y un toque cálido
const GradoCine = {
  uniforms: { tDiffuse: { value: null }, tiempo: { value: 0 }, grano: { value: 0.06 }, vineta: { value: 0.9 }, tinte: { value: new THREE.Vector3(1.06, 1.0, 0.9) } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float tiempo; uniform float grano; uniform float vineta; uniform vec3 tinte; varying vec2 vUv;
    float az(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)) + tiempo*43.0) * 43758.5453); }
    void main(){ vec4 c = texture2D(tDiffuse, vUv);
      c.rgb = mix(c.rgb, c.rgb * tinte, 0.6);
      float d = distance(vUv, vec2(0.5)); c.rgb *= mix(1.0, smoothstep(0.85, 0.25, d), vineta * 0.55);
      c.rgb += (az(vUv * 1000.0) - 0.5) * grano;
      gl_FragColor = c; }`,
};

function persianas() {  // luz que entra por una persiana, como en las tomas de atardecer
  const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d');
  x.fillStyle = '#000'; x.fillRect(0, 0, 256, 256); x.fillStyle = '#fff';
  for (let i = 0; i < 9; i++) x.fillRect(0, 14 + i * 26, 256, 15);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

const bandas = (() => {
  const d = new Uint8Array([90, 170, 255]);
  const t = new THREE.DataTexture(d, 3, 1, THREE.RedFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t;
})();

function material(color, extra = {}) {
  return new THREE.MeshToonMaterial(Object.assign({ color: new THREE.Color(color || '#dddddd'), gradientMap: bandas }, extra));
}

function engrane(o) {
  const dientes = o.dientes || 12, r = o.radio || 1, h = o.alto || 0.3, prof = r * 0.18;
  const s = new THREE.Shape();
  for (let i = 0; i < dientes * 4; i++) {
    const a = (i / (dientes * 4)) * Math.PI * 2;
    const rr = (i % 4 < 2) ? r : r - prof;
    const x = Math.cos(a) * rr, y = Math.sin(a) * rr;
    i === 0 ? s.moveTo(x, y) : s.lineTo(x, y);
  }
  const hueco = new THREE.Path(); hueco.absarc(0, 0, r * 0.25, 0, Math.PI * 2, true); s.holes.push(hueco);
  const g = new THREE.ExtrudeGeometry(s, { depth: h, bevelEnabled: false });
  g.translate(0, 0, -h / 2); g.rotateX(Math.PI / 2); return g;
}

function resorte(o) {
  const vueltas = o.vueltas || 6, r = o.radio || 0.5, h = o.alto || 2;
  class Helice extends THREE.Curve {
    getPoint(t) { const a = t * vueltas * Math.PI * 2; return new THREE.Vector3(Math.cos(a) * r, t * h - h / 2, Math.sin(a) * r); }
  }
  return new THREE.TubeGeometry(new Helice(), vueltas * 24, o.grosor || r * 0.12, 8, false);
}

function geometria(o) {
  const t = o.tam || [1, 1, 1];
  switch (o.forma) {
    case 'caja': return new THREE.BoxGeometry(t[0], t[1], t[2]);
    case 'cilindro': return new THREE.CylinderGeometry(o.radio_arriba ?? o.radio ?? 0.5, o.radio ?? 0.5, o.alto || 1, o.lados || 28);
    case 'cono': return new THREE.ConeGeometry(o.radio || 0.5, o.alto || 1, o.lados || 28);
    case 'esfera': return new THREE.SphereGeometry(o.radio || 0.5, 32, 20);
    case 'toro': case 'anillo': return new THREE.TorusGeometry(o.radio || 1, o.grosor || 0.15, 14, 48);
    case 'capsula': return new THREE.CapsuleGeometry(o.radio || 0.3, o.alto || 1, 8, 20);
    case 'cuna': { const g = new THREE.CylinderGeometry(0.5, 0.5, 1, 3); g.scale(t[0], t[1], t[2]); return g; }
    case 'engrane': return engrane(o);
    case 'resorte': return resorte(o);
    case 'plano': return new THREE.PlaneGeometry(t[0], t[1]);
    case 'tubo': {
      const pts = (o.puntos || [[0, 0, 0], [1, 1, 0]]).map(p => new THREE.Vector3(...p));
      return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 48, o.grosor || 0.08, 10, false);
    }
    default: return new THREE.BoxGeometry(t[0], t[1], t[2]);
  }
}

function texto(t, color = '#111111', fondo = '#ffffff') {
  const c = document.createElement('canvas'), x = c.getContext('2d');
  // estilo STORY: etiqueta oscura translúcida con filo dorado y texto dorado en mayúsculas espaciadas
  t = String(t).toUpperCase();
  const f = 54; x.font = `600 ${f}px "IBM Plex Mono", Menlo, monospace`;
  const w = Math.ceil(x.measureText(t).width + t.length * 6) + 70; c.width = w; c.height = f + 50;
  x.font = `600 ${f}px "IBM Plex Mono", Menlo, monospace`;
  x.fillStyle = 'rgba(10,10,12,0.72)'; x.strokeStyle = '#C9A24A'; x.lineWidth = 3;
  x.beginPath(); x.roundRect(3, 3, w - 6, c.height - 6, 6); x.fill(); x.stroke();
  x.fillStyle = '#E6C77A'; x.textBaseline = 'middle';
  let px = 35; for (const ch of t) { x.fillText(ch, px, c.height / 2 + 2); px += x.measureText(ch).width + 6; }
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true, sizeAttenuation: false }));
  s.userData.aspecto = w / c.height; s.renderOrder = 10; return s;
}

const suave = u => u <= 0 ? 0 : u >= 1 ? 1 : u * u * (3 - 2 * u);
const rebote = u => { if (u <= 0) return 0; if (u >= 1) return 1; const c = 1.70158 + 1; return 1 + c * Math.pow(u - 1, 3) + 1.70158 * Math.pow(u - 1, 2); };


// ---------------- cortometrajes: personajes, cuartos y luces prácticas ----------------
// Personaje de líneas facetadas (low poly) con una luz en el pecho, como en los cortos animados de referencia.
// Mide 1.7 m de pie. Sentado, su pecho queda a 0.9 m y la cabeza a 1.25 m.
const luces = [];   // {luz, base, id, malla}  para que el pecho "hable" o una lámpara parpadee
function matFacetado(color, emisivo, k = 0.12) {
  return new THREE.MeshStandardMaterial({ color: new THREE.Color(color), flatShading: true, roughness: 0.78, metalness: 0.0,
    emissive: new THREE.Color(emisivo || '#000000'), emissiveIntensity: emisivo ? k : 0 });
}
function pieza(geo, mat, x, y, z) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; return m; }
function articulacion(padre, x, y, z) { const g = new THREE.Group(); g.position.set(x, y, z); padre.add(g); return g; }

const POSES = {
  de_pie:        { cadera: [0, 0], rodilla: [0, 0], hombro: [6, -6], codo: [-10, -10], torso: 0, cabeza: 0, alto: 0.92 },
  caminando:     { cadera: [22, -22], rodilla: [-8, -30], hombro: [-20, 20], codo: [-15, -15], torso: 4, cabeza: 0, alto: 0.9 },
  sentado:       { cadera: [-88, -88], rodilla: [88, 88], hombro: [10, -4], codo: [-55, -50], torso: 4, cabeza: 0, alto: 0.47 },
  cabizbajo:     { cadera: [-88, -88], rodilla: [88, 88], hombro: [-38, -38], codo: [-62, -62], torso: 28, cabeza: 42, alto: 0.47 },
  brazos_cruzados: { cadera: [0, 0], rodilla: [0, 0], hombro: [-25, -25], codo: [-110, -110], torso: 0, cabeza: 0, alto: 0.92, cruzar: true },
  senalando:     { cadera: [0, 0], rodilla: [0, 0], hombro: [-80, 6], codo: [-5, -10], torso: 0, cabeza: 0, alto: 0.92 },
  manos_cara:    { cadera: [-88, -88], rodilla: [88, 88], hombro: [-75, -75], codo: [-120, -120], torso: 22, cabeza: 30, alto: 0.47, cruzar: true },
  acostado:      { cadera: [0, 0], rodilla: [0, 0], hombro: [4, -4], codo: [-5, -5], torso: 0, cabeza: 0, alto: 0.92, acostado: true },
};

// personajes de caricatura (tarjetas dibujadas a mano dentro del mundo 3D); 'facetado' deja los maniquíes viejos
const toons = [];
function personaje(o) {
  if ((def.personajes || 'caricatura') === 'caricatura') {
    const t = crearPersonaje(o, def.genero || ''); t.id = o.id; toons.push(t);
    return t.raiz;
  }
  return personajeFacetado(o);
}
function personajeFacetado(o) {
  const raiz = new THREE.Group();
  const cuerpo = new THREE.Group(); raiz.add(cuerpo);
  const luzColor = o.luz || null;
  // colores muy claros se queman con las luces de noche: se topan a un gris medio
  const topar = (c, def) => { const k = new THREE.Color(c || def); const hsl = {}; k.getHSL(hsl); if (hsl.l > 0.38) k.setHSL(hsl.h, hsl.s, 0.38); return '#' + k.getHexString(); };
  const mat = matFacetado(topar(o.color, '#666B7C'), luzColor, 0.07);
  const matOscuro = matFacetado(topar(o.color_ropa || o.color, '#4E5363'), luzColor, 0.05);
  const p = POSES[o.pose] || POSES.de_pie;
  const cadera = articulacion(cuerpo, 0, p.alto, 0);
  // torso facetado, más ancho en los hombros
  const torso = articulacion(cadera, 0, 0, 0); torso.rotation.x = R(p.torso);
  const tg = new THREE.CylinderGeometry(0.2, 0.16, 0.58, 6, 1); tg.scale(1, 1, 0.62);
  torso.add(pieza(tg, matOscuro, 0, 0.32, 0));
  const pg = new THREE.CylinderGeometry(0.165, 0.15, 0.16, 6, 1); pg.scale(1, 1, 0.66); cadera.add(pieza(pg, matOscuro, 0, 0.0, 0));
  const cuello = pieza(new THREE.CylinderGeometry(0.05, 0.06, 0.08, 5), mat, 0, 0.64, 0); torso.add(cuello);
  const cab = articulacion(torso, 0, 0.68, 0); cab.rotation.x = R(p.cabeza);
  const hg = new THREE.IcosahedronGeometry(0.13, 0); hg.scale(0.92, 1.18, 1.0);
  cab.add(pieza(hg, mat, 0, 0.13, 0));
  if (o.peinado === 'chongo') { cab.add(pieza(new THREE.IcosahedronGeometry(0.075, 0), matOscuro, 0, 0.29, -0.06)); cab.add(pieza(new THREE.IcosahedronGeometry(0.135, 0), matOscuro, 0, 0.17, -0.025)); }
  if (o.peinado === 'largo') { const g = new THREE.CylinderGeometry(0.12, 0.15, 0.34, 6, 1, true, Math.PI * 0.55, Math.PI * 0.9); cab.add(pieza(g, new THREE.MeshStandardMaterial({ color: new THREE.Color(o.color_pelo || '#1E1A24'), flatShading: true, roughness: 0.9, side: THREE.DoubleSide }), 0, 0.05, -0.01)); cab.add(pieza(new THREE.IcosahedronGeometry(0.138, 0), new THREE.MeshStandardMaterial({ color: new THREE.Color(o.color_pelo || '#1E1A24'), flatShading: true, roughness: 0.9 }), 0, 0.17, -0.025)); }
  if (o.peinado === 'corto') cab.add(pieza(new THREE.IcosahedronGeometry(0.137, 0), matOscuro, 0, 0.18, -0.025));
  if (o.peinado === 'gorra') { cab.add(pieza(new THREE.CylinderGeometry(0.14, 0.14, 0.08, 7), matOscuro, 0, 0.25, 0)); cab.add(pieza(new THREE.BoxGeometry(0.2, 0.02, 0.14), matOscuro, 0, 0.22, 0.13)); }
  if (o.cara === 'ojos' || o.cara === 'ojos_brillo') {
    const mo = o.cara === 'ojos_brillo' ? new THREE.MeshBasicMaterial({ color: new THREE.Color(o.color_ojos || '#FFFFFF') }) : new THREE.MeshBasicMaterial({ color: 0x050505 });
    for (const x of [-0.045, 0.045]) cab.add(pieza(new THREE.SphereGeometry(0.016, 8, 6), mo, x, 0.15, 0.115));
  }
  // brazos: hombro y codo
  const brazo = (lado, i) => {
    const h = articulacion(torso, lado * 0.25, 0.56, 0); h.rotation.x = R(p.hombro[i]); h.rotation.z = R(lado * 9);
    if (raiz.userData.partes) raiz.userData.partes.hombros.push(h);
    h.add(pieza(new THREE.CylinderGeometry(0.055, 0.048, 0.3, 5), mat, 0, -0.15, 0));
    const c = articulacion(h, 0, -0.3, 0); c.rotation.x = R(p.codo[i]);
    if (p.cruzar) { h.rotation.y = R(-lado * 25); c.rotation.y = R(-lado * 70); }
    c.add(pieza(new THREE.CylinderGeometry(0.046, 0.04, 0.28, 5), mat, 0, -0.14, 0));
    c.add(pieza(new THREE.IcosahedronGeometry(0.05, 0), mat, 0, -0.3, 0));
    if (raiz.userData.partes) raiz.userData.partes.codos.push(c);
  };
  raiz.userData.partes = { torso, cab, hombros: [], codos: [], fase: (o.id || 'x').length * 1.7 };
  brazo(-1, 0); brazo(1, 1);
  const pt = raiz.userData.partes;
  pt.base = { torso: torso.rotation.clone(), cab: cab.rotation.clone(), hombros: pt.hombros.map(h => h.rotation.clone()), codos: pt.codos.map(c => c.rotation.clone()) };
  const pierna = (lado, i) => {
    const h = articulacion(cadera, lado * 0.1, 0, 0); h.rotation.x = R(p.cadera[i]);
    h.add(pieza(new THREE.CylinderGeometry(0.08, 0.065, 0.45, 5), matOscuro, 0, -0.225, 0));
    const r = articulacion(h, 0, -0.45, 0); r.rotation.x = R(p.rodilla[i]);
    r.add(pieza(new THREE.CylinderGeometry(0.062, 0.05, 0.43, 5), matOscuro, 0, -0.215, 0));
    r.add(pieza(new THREE.BoxGeometry(0.1, 0.06, 0.2), matOscuro, 0, -0.45, 0.05));
  };
  pierna(-1, 0); pierna(1, 1);
  if (p.acostado) { cuerpo.rotation.x = R(-90); cuerpo.position.set(0, 0.12, 0.9); }
  const esc = (o.altura || 1.7) / 1.7; cuerpo.scale.setScalar(esc);
  if (luzColor) {  // la luz del pecho: cuenta lo que siente el personaje y late cuando habla
    const nucleo = pieza(new THREE.OctahedronGeometry(0.035, 0), new THREE.MeshBasicMaterial({ color: new THREE.Color(luzColor).multiplyScalar(2.2) }), 0, 0.42, 0.105);
    nucleo.castShadow = false; torso.add(nucleo);
    const l = new THREE.PointLight(new THREE.Color(luzColor), o.intensidad ?? 0.9, 2.4, 1.8);
    l.position.set(0, 0.42, 0.3); torso.add(l);
    luces.push({ luz: l, base: l.intensity, id: o.id, malla: nucleo, tipo: 'pecho' });
  }
  raiz.userData.cabeza = cab;
  return raiz;
}

function texturaPapel(color, motivo) {
  const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d');
  x.fillStyle = color; x.fillRect(0, 0, 256, 256);
  const tono = new THREE.Color(color).offsetHSL(0, -0.05, 0.12).getStyle();
  x.fillStyle = tono; x.strokeStyle = tono; x.lineWidth = 6;
  if (motivo === 'flores') for (const [a, b] of [[64, 64], [192, 64], [128, 160], [0, 160], [256, 160], [64, 256], [192, 256], [64, 0], [192, 0]]) {
    for (let k = 0; k < 5; k++) { const ang = k * Math.PI * 2 / 5; x.beginPath(); x.ellipse(a + Math.cos(ang) * 10, b + Math.sin(ang) * 10, 9, 5, ang, 0, Math.PI * 2); x.fill(); }
  }
  if (motivo === 'rayas') for (let i = 0; i < 256; i += 32) x.fillRect(i, 0, 10, 256);
  if (motivo === 'azulejo') { x.strokeStyle = new THREE.Color(color).offsetHSL(0, 0, -0.12).getStyle(); x.lineWidth = 4; for (let i = 0; i <= 256; i += 64) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, 256); x.moveTo(0, i); x.lineTo(256, i); x.stroke(); } }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}

// cuarto: piso, tres paredes (la cámara mira desde el lado abierto), techo opcional, puerta y ventana
function cuarto(o) {
  const g = new THREE.Group(); const [w, h, d] = o.tam || [4, 2.6, 4];
  const papel = o.papel ? texturaPapel(o.color || '#6B6A8E', o.papel) : null;
  if (papel) papel.repeat.set(w / 1.2, h / 1.2);
  const matPared = new THREE.MeshStandardMaterial({ color: papel ? '#ffffff' : (o.color || '#6B6A8E'), map: papel, roughness: 0.92, side: THREE.DoubleSide });
  const matPiso = new THREE.MeshStandardMaterial({ color: o.piso || '#4A3A30', roughness: 0.8, map: o.piso_motivo ? texturaPapel(o.piso || '#4A3A30', o.piso_motivo) : null });
  if (matPiso.map) { matPiso.color.set('#ffffff'); matPiso.map.repeat.set(w / 1.5, d / 1.5); }
  const plano = (mw, mh, mat, x, y, z, rx, ry) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(mw, mh), mat); m.position.set(x, y, z); m.rotation.set(rx, ry, 0); m.receiveShadow = true; g.add(m); return m; };
  plano(w, d, matPiso, 0, 0.002, 0, -Math.PI / 2, 0);
  plano(w, h, matPared, 0, h / 2, -d / 2, 0, 0);
  plano(d, h, matPared, -w / 2, h / 2, 0, 0, Math.PI / 2);
  plano(d, h, matPared, w / 2, h / 2, 0, 0, -Math.PI / 2);
  if (o.techo) plano(w, d, new THREE.MeshStandardMaterial({ color: o.techo === true ? '#BDB7AE' : o.techo, roughness: 0.9, side: THREE.DoubleSide }), 0, h, 0, Math.PI / 2, 0);
  const pared = (cual, x) => cual === 'izq' ? [[-w / 2 + 0.03, 0, x], Math.PI / 2] : cual === 'der' ? [[w / 2 - 0.03, 0, x], -Math.PI / 2] : [[x, 0, -d / 2 + 0.03], 0];
  if (o.puerta) {
    const pu = o.puerta === true ? {} : o.puerta; const [pp, ry] = pared(pu.pared || 'fondo', pu.x ?? 0.9);
    const marco = new THREE.Group(); marco.position.set(...pp); marco.rotation.y = ry; g.add(marco);
    const hoja = new THREE.Group(); hoja.position.set(-0.45, 0, 0.03); marco.add(hoja);
    hoja.add(pieza(new THREE.BoxGeometry(0.9, 2.05, 0.05), new THREE.MeshStandardMaterial({ color: pu.color || '#6E4A2E', roughness: 0.7 }), 0.45, 1.025, 0));
    hoja.add(pieza(new THREE.SphereGeometry(0.035, 10, 8), new THREE.MeshStandardMaterial({ color: '#D9B25A', metalness: 1, roughness: 0.3 }), 0.8, 1.0, 0.05));
    hoja.rotation.y = R(pu.abierta || 0);
    objetos[(o.id || 'cuarto') + '_puerta'] = hoja; base[(o.id || 'cuarto') + '_puerta'] = { pos: hoja.position.clone(), rot: hoja.rotation.clone(), escala: 1, color: null, malla: null };
    if (pu.luz_detras) { const l = new THREE.PointLight(new THREE.Color(pu.luz_detras), 1.6, 3, 1.8); l.position.set(0, 1.4, -0.6); marco.add(l); }
  }

  } else if (tipo === 'hombro' && P && id2 && infoPersonaje(id2)) {
    const B = infoPersonaje(id2);
    const hacia = B.cab.clone().sub(P.cab).setY(0).normalize();
    pos = P.cab.clone().sub(hacia.clone().multiplyScalar(toons.length ? 1.05 : 0.55)).add(lado(hacia).multiplyScalar(toons.length ? 0.62 : 0.32)); pos.y = P.cab.y + (toons.length ? 0.12 : 0.05);
    mira = B.cab.clone().add(new THREE.Vector3(0, -0.15, 0));
  } else if (tipo === 'pov' && P) {
    if (toons.length) def._sinCuerpo = id;
    pos = P.cab.clone().add(P.frente.clone().multiplyScalar(toons.length ? -0.35 : 0.18)); pos.y -= 0.08;
    const otro = id2 && infoPersonaje(id2);
    mira = otro ? otro.cab.clone().add(new THREE.Vector3(0, -0.2, 0)) : pos.clone().add(P.frente.clone().multiplyScalar(3)).add(new THREE.Vector3(0, -0.25, 0));
  } else if (tipo === 'nuca' && P) {
    pos = P.cab.clone().sub(P.frente.clone().multiplyScalar(1.1)); pos.y = P.cab.y + 0.15;
    mira = P.cab.clone().add(P.frente.clone().multiplyScalar(2.5)); mira.y = P.pecho.y;
  } else if (tipo === 'detalle' && id && cajaDe(id)) {
    const c = cajaDe(id), centro = c.getCenter(new THREE.Vector3()), t = c.getSize(new THREE.Vector3());
    const d0 = distPara(Math.max(t.y, 0.15) * 1.8, Math.max(t.x, t.z, 0.15) * 1.6) + Math.max(t.x, t.z) * 0.5;
    mira = centro; pos = centro.clone().add(new THREE.Vector3(0.35, 0.45, 1).normalize().multiplyScalar(d0));
  } else {

    const c = new THREE.Box3();
    const grupo = tipo === 'dos' || personajes.length ? personajes : [];
    if (grupo.length) for (const q of grupo) q.g.userData.toon ? c.union(cajaToon(q.g)) : c.expandByObject(q.g);
    else for (const o of d.objetos || []) if (objetos[o.id] && !['cuarto', 'vagon', 'bokeh', 'serie_luces', 'foco'].includes(o.forma)) c.expandByObject(objetos[o.id]);
    if (c.isEmpty()) c.setFromCenterAndSize(new THREE.Vector3(0, 1, 0), new THREE.Vector3(2, 2, 2));
    const centro = c.getCenter(new THREE.Vector3()), t = c.getSize(new THREE.Vector3());

      const sep = linea.length(); linea.normalize();
      const perp = lado(linea); if (perp.dot(frente) < 0) perp.negate();

    const caja = (q.g.userData.toon ? cajaToon(q.g) : new THREE.Box3().setFromObject(q.g)).expandByScalar(0.25);
    if (caja.containsPoint(pos)) pos.add(pos.clone().sub(mira).setY(0).normalize().multiplyScalar(0.6));
  }
  const cuarto = (d.objetos || []).find(o => (o.forma === 'cuarto' || o.forma === 'vagon') && objetos[o.id]);

    const [w, h, fondo] = (cuarto.tam || (cuarto.forma === 'vagon' ? [2.7, 2.3, 9] : [4, 2.6, 4])); const c0 = new THREE.Vector3(...(cuarto.pos || [0, 0, 0]));

    if ((tipo === 'dos' || tipo === 'general') && Math.abs(pos.x - x0) > 0.3 && personajes.length) {
      const c = new THREE.Box3(); for (const q of personajes) q.g.userData.toon ? c.union(cajaToon(q.g)) : c.expandByObject(q.g);
      const t = c.getSize(new THREE.Vector3()), centro = c.getCenter(new THREE.Vector3());
      const dz = distPara(t.y * 1.25, (t.x + 0.2) * 1.05) + t.z / 2;
      const lejos = 1;
      pos = new THREE.Vector3(c0.x + (centro.x - c0.x) * 0.3, Math.min(h - 0.25, centro.y + 0.45), THREE.MathUtils.clamp(centro.z + lejos * dz, c0.z - fondo / 2 + 0.3, c0.z + fondo / 2 + 2.5));

    const minimo = tipo === 'primer' ? 1.15 : tipo === 'hombro' ? 0.7 : 1.0;
    const plano2 = (q) => Math.hypot(q.x - P.pos.x, q.z - P.pos.z);
    if (plano2(pos) < minimo) {
      const dentro = (q) => { if (!cuarto) return true; const [w, , fondo] = (cuarto.tam || (cuarto.forma === 'vagon' ? [2.7, 2.3, 9] : [4, 2.6, 4])); const c0 = cuarto.pos || [0, 0, 0];
        return Math.abs(q.x - c0[0]) < w / 2 - 0.3 && q.z > c0[2] - fondo / 2 + 0.3 && q.z < c0[2] + fondo / 2 + 2.5; };
      const v0 = pos.clone().sub(P.pos).setY(0); if (v0.length() < 0.05) v0.copy(P.frente); v0.normalize();
      for (const g of [0, 35, -35, 70, -70, 110, -110, 150, -150]) {
        const v = v0.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), THREE.MathUtils.degToRad(g)).multiplyScalar(minimo + 0.25);

    for (const o of d.objetos || []) if (['cuarto', 'vagon', 'bokeh', 'serie_luces', 'foco'].includes(o.forma) || o.id === id || o.id === id2) objetos[o.id] && objetos[o.id].traverse(n => ignorar.add(n));

    const sujeto = (tipo === 'nuca' || tipo === 'primer' || tipo === 'medio') && P ? P.cab.clone() : tipo === 'hombro' && B2 ? B2.cab.clone() : mira.clone();

    if (choque(pos)) {

      const techo = cuarto ? ((cuarto.tam || (cuarto.forma === 'vagon' ? [2.7, 2.3, 9] : [4, 2.6, 4])))[1] - 0.2 : 4;

}

function camaraEn(u) {
  const ks = def.camara && def.camara.length ? def.camara : [{ t: 0, pos: [6, 4, 7], mira: [0, 0.5, 0] }];

    p.lerp(m0, 0.14 * suave(u)); p.y += 0.06 * u;

}

window.cuadro = (u) => {
  for (const id in objetos) {
    const g = objetos[id], b = base[id]; if (!b) continue;
    g.position.copy(b.pos); g.rotation.copy(b.rot); g.scale.setScalar(b.escala); g.visible = true;
    if (b.malla) b.malla.material.color.copy(b.color);
  }
  for (const an of def.animar || []) {
    const g = objetos[an.id], b = base[an.id]; if (!g) continue;
    const t0 = an.t0 ?? 0, t1 = an.t1 ?? 1;
    const k = an.rebote ? rebote((u - t0) / Math.max(1e-3, t1 - t0)) : suave((u - t0) / Math.max(1e-3, t1 - t0));
    if (an.mover) g.position.add(new THREE.Vector3(...an.mover).multiplyScalar(k));
    if (an.girar) { g.rotation.x += R(an.girar[0]) * k; g.rotation.y += R(an.girar[1]) * k; g.rotation.z += R(an.girar[2]) * k; }
    if (an.girar_siempre) { const v = an.girar_siempre; g.rotation.x += R(v[0]) * u; g.rotation.y += R(v[1]) * u; g.rotation.z += R(v[2]) * u; }
    if (an.aparece) { if (u < t0) g.visible = false; else g.scale.setScalar(b.escala * Math.max(0.001, rebote(Math.min(1, (u - t0) / Math.max(0.05, t1 - t0))))); }
    if (an.desaparece && u > t1) g.visible = false;
    if (an.escala) g.scale.setScalar(b.escala * (1 + (an.escala - 1) * k));
    if (an.resaltar && b.malla && u >= t0 && u <= t1 + 0.15) {
      const p = 0.5 + 0.5 * Math.sin((u - t0) * 40);
      b.malla.material.color.copy(b.color).lerp(new THREE.Color(an.color || '#FFD23F'), 0.35 + 0.45 * p);
    }
  }
  for (const L of luces) {  // el pecho late cuando su personaje habla; los focos pueden parpadear
    let k = 1;
    const tramos = (def.habla || {})[L.id];
    if (L.tipo === 'pecho') {
      k = 0.75;
      if (tramos) for (const [a, b] of tramos) if (u >= a && u <= b) k = 1.25 + 0.35 * Math.sin(u * 90 + a * 7);
    }
    for (const an of def.animar || []) if (an.id === L.id && an.parpadeo && u >= (an.t0 ?? 0) && u <= (an.t1 ?? 1)) {
      const r = Math.sin(u * 211.0) * Math.sin(u * 97.0 + 1.3); k *= r > 0.35 ? 0.05 : 1;
    }
    for (const an of def.animar || []) if (an.id === L.id && an.apagar && u >= (an.t0 ?? 0)) k *= Math.max(0, 1 - (u - (an.t0 ?? 0)) / 0.06);
    L.luz.intensity = L.base * k; L.malla.visible = k > 0.08;

  const seg = (def._dur || 4) * u;
  for (const id in base) {
    const pt = base[id].partes; if (!pt) continue;
    pt.torso.rotation.copy(pt.base.torso); pt.cab.rotation.copy(pt.base.cab);
    pt.hombros.forEach((h, i) => h.rotation.copy(pt.base.hombros[i])); pt.codos.forEach((c, i) => c.rotation.copy(pt.base.codos[i]));
    const f = pt.fase;
    pt.torso.rotation.x += 0.025 * Math.sin(seg * 1.7 + f);
    pt.torso.rotation.z += 0.012 * Math.sin(seg * 0.9 + f);

    pt.cab.rotation.x += 0.03 * Math.sin(seg * 1.1 + f);

    for (const [a, b] of ((def.habla || {})[id] || [])) if (u >= a - 0.02 && u <= b + 0.04) habla = 1;

      pt.cab.rotation.y += 0.05 * Math.sin(seg * 4.3 + f);

      t.raiz.updateMatrixWorld(true);

      const d = new THREE.Vector2(loc.x, loc.z); const n = d.length() || 1; d.divideScalar(n);

      if (def._sinCuerpo === t.id) t.raiz.visible = false;                            // en su propio pov no se ve a sí mismo

      const espaldas = d.y < -0.35;

      for (const [a, b] of ((def.habla || {})[t.id] || [])) if (u >= a - 0.01 && u <= b + 0.02) habla = true;
      for (const id2 in (def.habla || {})) for (const [a] of def.habla[id2]) if (u >= a) tramo++;  // cuántas frases van: la cara cambia
      const cb = base[t.id] && base[t.id].cabeza; const look = cb ? Math.max(-1, Math.min(1, -cb.rotation.y / 0.7)) : 0;

    }

  return renderer.domElement.toDataURL('image/jpeg', 0.9);
};
window.__toons = () => toons.map(t => ({ id: t.id, vis: t.raiz.visible, pos: t.raiz.getWorldPosition(new THREE.Vector3()).toArray(), z: t.tarjeta.position.toArray(), map: !!t.tarjeta.material.map }));

window.listo = true;
</script>
