<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head><body>
<script type="module">
import * as THREE from './three.module.min.js';
import { OutlineEffect } from './OutlineEffect.js';

// Escena 3D estilo caricatura: sombreado en bandas, contorno negro, colores planos.
// window.preparar(def, ancho, alto) arma la escena; window.cuadro(u) la dibuja en el instante u (0..1) y devuelve un JPEG.
const R = THREE.MathUtils.degToRad;
let renderer, efecto, escena, camara, def, objetos = {}, base = {}, sprites = [], flechas = [];

const bandas = (() => {
  const d = new Uint8Array([90, 170, 255]);
  const t = new THREE.DataTexture(d, 3, 1, THREE.RedFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t;
})();

function material(color, extra = {}) {
  return new THREE.MeshToonMaterial(Object.assign({ color: new THREE.Color(color || '#dddddd'), gradientMap: bandas }, extra));
}

function engrane(o) {
  const dientes = o.dientes || 12, r = o.radio || 1, h = o.alto || 0.3, prof = r * 0.18;
  const s = new THREE.Shape();
  for (let i = 0; i < dientes * 4; i++) {
    const a = (i / (dientes * 4)) * Math.PI * 2;
    const rr = (i % 4 < 2) ? r : r - prof;
    const x = Math.cos(a) * rr, y = Math.sin(a) * rr;
    i === 0 ? s.moveTo(x, y) : s.lineTo(x, y);
  }
  const hueco = new THREE.Path(); hueco.absarc(0, 0, r * 0.25, 0, Math.PI * 2, true); s.holes.push(hueco);
  const g = new THREE.ExtrudeGeometry(s, { depth: h, bevelEnabled: false });
  g.translate(0, 0, -h / 2); g.rotateX(Math.PI / 2); return g;
}

function resorte(o) {
  const vueltas = o.vueltas || 6, r = o.radio || 0.5, h = o.alto || 2;
  class Helice extends THREE.Curve {
    getPoint(t) { const a = t * vueltas * Math.PI * 2; return new THREE.Vector3(Math.cos(a) * r, t * h - h / 2, Math.sin(a) * r); }
  }
  return new THREE.TubeGeometry(new Helice(), vueltas * 24, o.grosor || r * 0.12, 8, false);
}

function geometria(o) {
  const t = o.tam || [1, 1, 1];
  switch (o.forma) {
    case 'caja': return new THREE.BoxGeometry(t[0], t[1], t[2]);
    case 'cilindro': return new THREE.CylinderGeometry(o.radio_arriba ?? o.radio ?? 0.5, o.radio ?? 0.5, o.alto || 1, o.lados || 28);
    case 'cono': return new THREE.ConeGeometry(o.radio || 0.5, o.alto || 1, o.lados || 28);
    case 'esfera': return new THREE.SphereGeometry(o.radio || 0.5, 32, 20);
    case 'toro': case 'anillo': return new THREE.TorusGeometry(o.radio || 1, o.grosor || 0.15, 14, 48);
    case 'capsula': return new THREE.CapsuleGeometry(o.radio || 0.3, o.alto || 1, 8, 20);
    case 'cuna': { const g = new THREE.CylinderGeometry(0.5, 0.5, 1, 3); g.scale(t[0], t[1], t[2]); return g; }
    case 'engrane': return engrane(o);
    case 'resorte': return resorte(o);
    case 'plano': return new THREE.PlaneGeometry(t[0], t[1]);
    case 'tubo': {
      const pts = (o.puntos || [[0, 0, 0], [1, 1, 0]]).map(p => new THREE.Vector3(...p));
      return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 48, o.grosor || 0.08, 10, false);
    }
    default: return new THREE.BoxGeometry(t[0], t[1], t[2]);
  }
}

function texto(t, color = '#111111', fondo = '#ffffff') {
  const c = document.createElement('canvas'), x = c.getContext('2d');
  const f = 64; x.font = `800 ${f}px Helvetica, Arial, sans-serif`;
  const w = Math.ceil(x.measureText(t).width) + 60; c.width = w; c.height = f + 44;
  x.font = `800 ${f}px Helvetica, Arial, sans-serif`;
  x.fillStyle = fondo; x.strokeStyle = '#111'; x.lineWidth = 8;
  const rr = 26; x.beginPath(); x.roundRect(4, 4, w - 8, c.height - 8, rr); x.fill(); x.stroke();
  x.fillStyle = color; x.textBaseline = 'middle'; x.fillText(t, 30, c.height / 2 + 2);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true, sizeAttenuation: false }));
  s.userData.aspecto = w / c.height; s.renderOrder = 10; return s;
}

const suave = u => u <= 0 ? 0 : u >= 1 ? 1 : u * u * (3 - 2 * u);
const rebote = u => { if (u <= 0) return 0; if (u >= 1) return 1; const c = 1.70158 + 1; return 1 + c * Math.pow(u - 1, 3) + 1.70158 * Math.pow(u - 1, 2); };

window.preparar = (d, ancho, alto) => {
  def = d;
  renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1); renderer.setSize(ancho, alto);
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);
  efecto = new OutlineEffect(renderer, { defaultThickness: 0.006, defaultColor: [0.07, 0.07, 0.07] });
  escena = new THREE.Scene();
  escena.background = new THREE.Color(d.fondo || '#BFE6F7');
  camara = new THREE.PerspectiveCamera(d.lente || 38, ancho / alto, 0.05, 400);
  escena.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 1.6));
  const sol = new THREE.DirectionalLight(0xffffff, 2.2);
  sol.position.set(6, 12, 8); sol.castShadow = true;
  sol.shadow.mapSize.set(2048, 2048);
  sol.shadow.bias = -0.0015; sol.shadow.normalBias = 0.03;
  escena.add(sol); escena.add(sol.target);
  if (d.suelo !== null && d.suelo !== false) {
    const suelo = new THREE.Mesh(new THREE.CircleGeometry(60, 64), material(d.suelo || '#9BD36A'));
    suelo.rotation.x = -Math.PI / 2; suelo.position.y = d.altura_suelo || 0; suelo.receiveShadow = true;
    suelo.userData.outlineParameters = { visible: false };
    escena.add(suelo);
  }
  for (const o of d.objetos || []) {
    const m = new THREE.Mesh(geometria(o), material(o.color, o.transparente ? { transparent: true, opacity: 0.45 } : {}));
    m.castShadow = true; m.receiveShadow = true;
    const g = new THREE.Group(); g.add(m);
    g.position.set(...(o.pos || [0, 0, 0]));
    const r = o.rot || [0, 0, 0]; g.rotation.set(R(r[0]), R(r[1]), R(r[2]));
    g.scale.setScalar(o.escala || 1);
    objetos[o.id || Math.random()] = g;
    base[o.id] = { pos: g.position.clone(), rot: g.rotation.clone(), escala: o.escala || 1, color: new THREE.Color(o.color || '#dddddd'), malla: m };
    (o.padre && objetos[o.padre] ? objetos[o.padre] : escena).add(g);
  }
  // la sombra se ajusta al tamaño de lo que hay en escena, para que salga nítida
  const caja = new THREE.Box3();
  for (const id in objetos) caja.expandByObject(objetos[id]);
  if (!caja.isEmpty()) {
    const centro = caja.getCenter(new THREE.Vector3()), radio = Math.max(1, caja.getSize(new THREE.Vector3()).length() * 0.7);
    sol.target.position.copy(centro);
    sol.position.copy(centro).add(new THREE.Vector3(0.45, 1, 0.6).normalize().multiplyScalar(radio * 3));
    const cs = sol.shadow.camera; cs.left = cs.bottom = -radio; cs.right = cs.top = radio; cs.near = 0.1; cs.far = radio * 6;
    cs.updateProjectionMatrix();
  }
  for (const e of d.etiquetas || []) {
    const s = texto(e.texto, e.color || '#111111', e.fondo || '#ffffff');
    s.position.set(...e.en); escena.add(s); sprites.push({ s, e });
  }
  for (const f of d.flechas || []) {
    const de = new THREE.Vector3(...f.de), a = new THREE.Vector3(...f.a);
    const dir = a.clone().sub(de); const largo = dir.length();
    const fl = new THREE.ArrowHelper(dir.normalize(), de, largo, new THREE.Color(f.color || '#FF4B3E'), Math.min(0.5, largo * 0.3), Math.min(0.3, largo * 0.18));
    fl.line.material.linewidth = 4; escena.add(fl); flechas.push({ fl, f, largo });
  }
};

function camaraEn(u) {
  const ks = def.camara && def.camara.length ? def.camara : [{ t: 0, pos: [6, 4, 7], mira: [0, 0.5, 0] }];
  let a = ks[0], b = ks[ks.length - 1];
  for (let i = 0; i < ks.length - 1; i++) if (u >= ks[i].t && u <= ks[i + 1].t) { a = ks[i]; b = ks[i + 1]; break; }
  const k = b.t > a.t ? suave((u - a.t) / (b.t - a.t)) : 0;
  const p = new THREE.Vector3(...a.pos).lerp(new THREE.Vector3(...b.pos), u < a.t ? 0 : k);
  const m = new THREE.Vector3(...(a.mira || [0, 0, 0])).lerp(new THREE.Vector3(...(b.mira || a.mira || [0, 0, 0])), u < a.t ? 0 : k);
  // vaivén leve para que la toma nunca quede quieta
  p.x += Math.sin(u * Math.PI * 2) * 0.08; p.y += Math.cos(u * Math.PI * 2) * 0.05;
  camara.position.copy(p); camara.lookAt(m);
}

window.cuadro = (u) => {
  for (const id in objetos) {
    const g = objetos[id], b = base[id]; if (!b) continue;
    g.position.copy(b.pos); g.rotation.copy(b.rot); g.scale.setScalar(b.escala); g.visible = true;
    b.malla.material.color.copy(b.color);
  }
  for (const an of def.animar || []) {
    const g = objetos[an.id], b = base[an.id]; if (!g) continue;
    const t0 = an.t0 ?? 0, t1 = an.t1 ?? 1;
    const k = an.rebote ? rebote((u - t0) / Math.max(1e-3, t1 - t0)) : suave((u - t0) / Math.max(1e-3, t1 - t0));
    if (an.mover) g.position.add(new THREE.Vector3(...an.mover).multiplyScalar(k));
    if (an.girar) { g.rotation.x += R(an.girar[0]) * k; g.rotation.y += R(an.girar[1]) * k; g.rotation.z += R(an.girar[2]) * k; }
    if (an.girar_siempre) { const v = an.girar_siempre; g.rotation.x += R(v[0]) * u; g.rotation.y += R(v[1]) * u; g.rotation.z += R(v[2]) * u; }
    if (an.aparece) { if (u < t0) g.visible = false; else g.scale.setScalar(b.escala * Math.max(0.001, rebote(Math.min(1, (u - t0) / Math.max(0.05, t1 - t0))))); }
    if (an.desaparece && u > t1) g.visible = false;
    if (an.escala) g.scale.setScalar(b.escala * (1 + (an.escala - 1) * k));
    if (an.resaltar && u >= t0 && u <= t1 + 0.15) {
      const p = 0.5 + 0.5 * Math.sin((u - t0) * 40);
      b.malla.material.color.copy(b.color).lerp(new THREE.Color(an.color || '#FFD23F'), 0.35 + 0.45 * p);
    }
  }
  for (const { s, e } of sprites) {
    const t0 = e.t0 ?? 0.15; const k = rebote(Math.min(1, Math.max(0, (u - t0) / 0.12)));
    s.visible = u >= t0; const alto = (e.tam || 0.06) * k; s.scale.set(alto * s.userData.aspecto, alto, 1);
  }
  for (const { fl, f, largo } of flechas) {
    const t0 = f.t0 ?? 0.2; const k = suave((u - t0) / 0.15); fl.visible = k > 0.01;
    fl.setLength(Math.max(0.01, largo * k), Math.min(0.5, largo * 0.3), Math.min(0.3, largo * 0.18));
  }
  camaraEn(u);
  efecto.render(escena, camara);
  return renderer.domElement.toDataURL('image/jpeg', 0.9);
};
window.listo = true;
</script>
</body></html>
